global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Node Exporter runs on the VM's host network; the container reaches it via host-gateway.
  # Installing Node Exporter directly on the VM instead? Use targets: ["localhost:9100"] when Prometheus is also native.
  - job_name: "node_exporter"
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          instance: "ubuntu-lab-01"
